[project]
name = "to-do"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "privatefaceSC", email = "ivan.laskov259@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
to-do = "to_do:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
