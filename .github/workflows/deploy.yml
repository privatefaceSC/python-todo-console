name: Deploy to Alwaysdata

on:
  push:
    branches: [ main ] # Запускать при пуше в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/www
            git pull origin main
            # Генерируем requirements.txt из uv.lock (используем полный путь, если uv не в PATH)
            ~/.local/bin/uv export --format requirements-txt > requirements.txt
            pip install -r requirements.txt
            pkill -f uvicorn || true