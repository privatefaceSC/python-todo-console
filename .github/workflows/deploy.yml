name: Deploy to Alwaysdata

on:
  push:
    branches: [ main ] # Запускать при пуше в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~/www
            rm -f requirements.txt
            git pull origin main
            ~/.local/bin/uv export --format requirements-txt --no-emit-project > requirements.txt
            pip install -r requirements.txt
            # Убиваем только процесс uvicorn, не трогая оболочку
            kill -9 $(pgrep -f "uvicorn api:app" | head -n 1) 2>/dev/null || true
            sleep 2
            exit 0