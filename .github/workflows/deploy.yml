name: Deploy to Alwaysdata

on:
  push:
    branches: [ main ] # Запускать при пуше в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd ~/www
            git checkout -- requirements.txt || true
            git pull --ff-only origin main
            ~/.local/bin/uv export --format requirements-txt --no-emit-project > requirements.txt
            pip install -r requirements.txt
            exit 0

      - name: Restart site on Alwaysdata
        run: |
          curl -X POST --basic --user "${{ secrets.ALWAYSDATA_API_KEY }} account=to-do:" \
          https://api.alwaysdata.com/v1/site/${{ secrets.ALWAYSDATA_SITE_ID }}/restart/